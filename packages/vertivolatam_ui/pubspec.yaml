name: vertivolatam_ui
description: Vertivo brand package — tokens.json + typed brand accessors on top of shared_ui_core.
publish_to: none
version: 0.1.0

environment:
  sdk: '^3.8.0'
  flutter: '>=3.32.0'

dependencies:
  flutter:
    sdk: flutter
  shared_ui_core:
    path: ../shared_ui_core

dev_dependencies:
  flutter_lints: '>=3.0.0 <7.0.0'
  flutter_test:
    sdk: flutter

flutter:
  assets:
    - assets/style_dictionary/tokens.json
